networks:
  lab3-net:
    name: lab3-net

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: lab3-zookeeper
    networks:
      - lab3-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker1
    container_name: lab3-broker1
    depends_on:
      - zookeeper
    networks:
      - lab3-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3

  broker2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker2
    container_name: lab3-broker2
    depends_on:
      - zookeeper
    networks:
      - lab3-net
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lab3-kafka-ui
    depends_on:
      - broker1
      - broker2
    networks:
      - lab3-net
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1:29092,broker2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  producer:
    build: ./producer
    container_name: lab3-producer
    depends_on:
      - broker1
      - broker2
    networks:
      - lab3-net
    environment:
      KAFKA_BOOTSTRAP: broker1:29092,broker2:29093
      TOPICS: trips-topic1,trips-topic2
      CSV_PATH: /data/Divvy_Trips_2019_Q4.csv
      MAX_ROWS: "5000"
    volumes:
      - ../docs/Divvy_Trips_2019_Q4.csv:/data/Divvy_Trips_2019_Q4.csv:ro
